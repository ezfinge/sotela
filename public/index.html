<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenShare - Compartilhamento de Tela</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #3a3a3a;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #4CAF50;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: #2a2a2a;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #3a3a3a;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .screens-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .screen-item {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
        }

        .screen-item video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .screen-item .screen-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .button {
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .button:hover {
            background: #45a049;
        }

        .button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .button.stop {
            background: #f44336;
        }

        .button.stop:hover {
            background: #da190b;
        }

        .input {
            padding: 12px;
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            color: white;
            width: 100%;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .channel-list {
            list-style: none;
        }

        .channel-item {
            padding: 10px;
            margin: 5px 0;
            background: #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .channel-item:hover {
            background: #4a4a4a;
        }

        .channel-item.active {
            background: #4CAF50;
        }

        .server-info {
            margin-bottom: 20px;
            padding: 15px;
            background: #3a3a3a;
            border-radius: 8px;
        }

        .server-link {
            color: #4CAF50;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.9rem;
            word-break: break-all;
            display: block;
            margin: 5px 0;
        }

        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .hidden {
            display: none !important;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
        }

        .status-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f44336;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .status-indicator.live {
            background: #4CAF50;
        }

        .invite-box {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .invite-link {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }

        .invite-link input {
            flex: 1;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ ScreenShare</h1>
        <div class="header-buttons">
            <button class="button" id="createServerBtn">Criar Servidor</button>
            <button class="button" id="joinServerBtn">Entrar em Servidor</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar hidden" id="sidebar">
            <div class="invite-box">
                <h3>📨 Convite</h3>
                <p style="font-size: 0.9rem; margin-top: 5px;">Compartilhe este link:</p>
                <div class="invite-link">
                    <input type="text" id="inviteLinkInput" readonly>
                    <button class="copy-btn" id="copyInviteBtn">📋 Copiar</button>
                </div>
                <p style="font-size: 0.8rem; margin-top: 10px; color: #aaa;">
                    Ou compartilhe o ID: <strong id="inviteId" style="color: #4CAF50;"></strong>
                    <button class="copy-btn" id="copyIdBtn">📋</button>
                </p>
            </div>

            <div class="server-info">
                <h3 id="serverName"></h3>
                <p class="server-link" id="serverLink"></p>
            </div>

            <button class="button" id="createChannelBtn" style="width: 100%; margin-bottom: 15px;">➕ Novo Canal</button>
            <h4 style="margin-bottom: 10px;">Canais:</h4>
            <ul class="channel-list" id="channelList"></ul>
        </div>

        <div class="main-content" id="mainContent">
            <div class="screens-container" id="screensContainer"></div>
            <div style="margin-top: 20px;">
                <button class="button hidden" id="shareScreenBtn">🖥️ Compartilhar Tela</button>
                <button class="button stop hidden" id="stopShareBtn">⏹️ Parar Compartilhamento</button>
            </div>
            <div id="noContent" style="text-align: center; color: #666; margin-top: 50px;">
                <h2>Bem-vindo ao ScreenShare</h2>
                <p>Crie ou entre em um servidor para começar</p>
            </div>
        </div>
    </div>

    <div class="status-indicator hidden" id="statusIndicator">🔴 NÃO ESTÁ TRANSMITINDO</div>

    <!-- Modal -->
    <div class="modal" id="serverModal">
        <div class="modal-content">
            <h2 id="modalTitle">Criar Servidor</h2>
            <input type="text" class="input" id="serverNameInput" placeholder="Nome do servidor">
            <input type="text" class="input hidden" id="serverIdInput" placeholder="ID do servidor">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="button" id="confirmServerBtn">Confirmar</button>
                <button class="button stop" id="cancelServerBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
